version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: fleet
    main: ./cmd/fleet
    binary: fleet
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: brizz-code-shim
    main: ./cmd/brizz-code-shim
    binary: brizz-code
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    ids:
      - fleet
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
  - id: brizz-code-shim
    ids:
      - brizz-code-shim
    formats:
      - tar.gz
    name_template: >-
      brizz-code_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

homebrew_casks:
  - name: fleet
    ids:
      - default
    binaries:
      - fleet
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/fleet"]
          end
    repository:
      owner: brizzai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/brizzai/fleet
    description: "TUI for managing multiple Claude Code sessions in parallel"
    dependencies:
      - formula: tmux

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: brizzai
    name: fleet
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  extra_files:
    - glob: chrome-extension.zip
