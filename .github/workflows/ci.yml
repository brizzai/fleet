name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Pinned to 1.26.6: 1.26.5 has stdlib vulns GO-2026-6218 (net/url), GO-2026-6090
  # (crypto/tls), GO-2026-5972 (encoding/asn1), GO-2026-5026 (net/http) (govulncheck).
  # Exact pin so setup-go pulls 1.26.6 from go.dev until the actions manifest
  # lists it; revert to floating "1.26" once it does.
  GO_VERSION: "1.26.6"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: go build ./...
      # The linux runner never compiles the darwin-tagged files
      # (proc_darwin.go, pressure_darwin.go, …); cross-compile so a macOS
      # build break is caught here, not at release time.
      - name: Build (darwin)
        run: GOOS=darwin go build ./...
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          install-mode: binary

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
