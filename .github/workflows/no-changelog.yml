name: No Changelog

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request &&
      (github.event.comment.body == '/no-changelog' || github.event.comment.body == '/no-changelog\n')
    steps:
      - name: Check permissions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission --jq '.permission')
          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "write" ]]; then
            echo "::error::User does not have write access"
            exit 1
          fi

      - name: Add label and react
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "no-changelog"
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content="+1"

      - name: Re-run the changelog check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Labelling with GITHUB_TOKEN fires no `labeled` event, so the already-failed
          # run must be re-run explicitly; it re-reads the label live and passes.
          HEAD_SHA=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --json headRefOid --jq '.headRefOid')
          RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow=changelog-check.yml \
            --commit "$HEAD_SHA" --status failure --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -n "$RUN_ID" ]]; then
            gh run rerun "$RUN_ID" --repo ${{ github.repository }}
          fi
